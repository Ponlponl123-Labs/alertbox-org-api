apiVersion: batch/v1
kind: Job
metadata:
  name: alertbox-org-api-migration-example
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: alertbox-org-api-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration-runner
          image: gomicro/goose:v3.24.1
          command:
            - /bin/sh
            - -c
            - |
              GOOSE_DBSTRING="${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true"
              goose -dir /migrations mysql "$GOOSE_DBSTRING" up
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          env:
            - name: DB_HOST
              value: "mariadb.default.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "alertbox"
            - name: DB_NAME
              value: "alertbox_org"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: alertbox-org-migrations
